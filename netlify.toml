[build]
  # Build command for Next.js
  command = "npm run build"
  # Publish directory (Next.js outputs to .next)
  publish = ".next"

# Next.js configuration
[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"

# Serverless functions configuration for Netlify
# Note: Next.js API routes are automatically converted to Netlify Functions
[functions]
  # Function bundler
  node_bundler = "esbuild"
  # Include all necessary files
  included_files = ["**/*"]
  # Note: Netlify free tier has 10s timeout, Pro has 26s
  # For longer timeouts, consider Netlify Pro or breaking into smaller functions

# Redirects for Next.js routing
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/next"
  status = 200

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# API route specific headers
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
