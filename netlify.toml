[build]
  # Build command for Next.js
  command = "npm run build"
  # Publish directory (Next.js outputs to .next)
  publish = ".next"

# Next.js configuration
[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js plugin is automatically detected by Netlify
# Note: Blobs upload may fail if not configured, but build will succeed
# We use Redis Labs for storage, so Blobs are not needed

# Serverless functions configuration for Netlify
# Note: Next.js API routes are automatically converted to Netlify Functions
[functions]
  # Function bundler - esbuild will bundle dependencies efficiently
  node_bundler = "esbuild"
  # Note: Chromium is externalized in webpack config
  # @sparticuz/chromium downloads Chromium at runtime, not bundled
  # Netlify free tier has 10s timeout, Pro has 26s max
  # Batch processing is optimized for Netlify Pro (26s timeout)
  # Processes 2 pages per batch to fit within timeout limit

# Function-specific timeout configuration (requires Netlify Pro)
# Free tier: 10s max, Pro tier: 26s max
[functions."app/api/audit/batch/route.ts"]
  timeout = 26  # Max timeout on Pro plan

[functions."app/api/audit/site/route.ts"]
  timeout = 26  # Max timeout on Pro plan

[functions."app/api/audit/route.ts"]
  timeout = 26  # Max timeout on Pro plan

[functions."app/api/audit/progress/[jobId]/route.ts"]
  timeout = 26  # Max timeout on Pro plan - allows time for Redis queries

# Redirects for Next.js routing
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/next"
  status = 200

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# API route specific headers
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"